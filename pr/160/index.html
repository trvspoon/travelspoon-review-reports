e) in \u003c(Object, String, String)>[","+    (","+      PlatformException(","+        code: 'channel-error',","+        message: '$marker failure message',","+        details: '$marker failure details',","+        stacktrace: '$marker failure native stacktrace',","+      ),","+      'PlatformException',","+      'channel-error',","+    ),","+    (","+      FirebaseException(","+        plugin: 'firebase_crashlytics',","+        code: 'unknown',","+        message: '$marker failure message',","+        stackTrace: StackTrace.fromString('$marker failure stack field'),","+      ),","+      'FirebaseException',","+      'firebase_crashlytics/unknown',","+    ),","+    (","+      PlatformException(","+        code: '$marker code',","+        message: '$marker failure message',","+      ),","+      'PlatformException',","+      'invalid',","+    ),","+  ]) {","+    test('원래 오류와 $type($code) 실패의 내용은 로그에 옮기지 않는다', () async {","+      await expectSummaries(failure, type, code);","+","+      expect(logs.join('\\n'), isNot(contains(marker)));","+    });","+  }","+","+  test('같은 stage의 같은 실패가 반복되면 1·2·4·8…번째에만 요약 줄과 스택 줄을 남긴다',","+      () async {","+    final failureStack = StackTrace.fromString('failure frame');","+    Future\u003cvoid> fail() => Future.error(StateError('failed'), failureStack);","+    await initialize(","+      recordFlutterError: (_) => fail(),","+      recordUncaughtError: (_, __) => fail(),","+    );","+","+    for (var count = 0; count \u003c 33; count++) {","+      await reportFlutterError();","+    }","+    for (var count = 0; count \u003c 3; count++) {","+      await reportUncaughtError();","+    }","+","+    expect(logs, [","+      for (final occurrence in [1, 2, 4, 8, 16, 32]) ...[","+        summaryLine('record_flutter_error', 'StateError', 'none', occurrence),","+        stackLine('record_flutter_error', 'failure frame'),","+      ],","+      for (final occurrence in [1, 2]) ...[","+        summaryLine('record_uncaught_error', 'StateError', 'none', occurrence),","+        stackLine('record_uncaught_error', 'failure frame'),","+      ],","+    ]);","+  });","+","+  test('상한을 넘는 스택도 남길 때마다 앞의 30줄과 생략 줄을 다시 남긴다', () async {","+    const stage = 'record_uncaught_error';","+    final failureStack = StackTrace.fromString([","+      for (var number = 1; number \u003c= 31; number++) 'failure frame $number',","+    ].join('\\n'));","+    await initialize(","+      recordUncaughtError: (_, __) =>","+          Future.error(StateError('failed'), failureStack),","+    );","+","+    for (var count = 0; count \u003c 2; count++) {","+      await reportUncaughtError();","+    }","+","+    expect(logs, [","+      for (final occurrence in [1, 2]) ...[","+        summaryLine(stage, 'StateError', 'none', occurrence),","+        for (var number = 1; number \u003c= 30; number++)","+          stackLine(stage, 'failure frame $number'),","+        omittedLine(stage, 1),","+      ],","+    ]);","+  });","+","+  test('failure_type이나 failure_code가 다른 실패는 occurrence를 따로 센다', () async {","+    const stage = 'record_uncaught_error';","+    final failureStack = StackTrace.fromString('failure frame');","+    final failures = \u003cObject>[","+      StateError('failed'),","+      PlatformException(code: 'channel-error'),","+      PlatformException(code: 'unavailable'),","+      StateError('failed'),","+      StateError('failed'),","+    ];","+    final failureCount = failures.length;","+    await initialize(","+      recordUncaughtError: (_, __) =>","+          Future.error(failures.removeAt(0), failureStack),","+    );","+","+    for (var count = 0; count \u003c failureCount; count++) {","+      await reportUncaughtError();","+    }","+","+    // 마지막 StateError는 그 조합의 3번째 실패라 줄을 남기지 않는다.","+    expect(logs, [","+      summaryLine(stage, 'StateError', 'none', 1),","+      stackLine(stage, 'failure frame'),","+      summaryLine(stage, 'PlatformException', 'channel-error', 1),","+      stackLine(stage, 'failure frame'),","+      summaryLine(st <script>
const data=JSON.parse(document.querySelector('#report').textContent);
const q=s=>document.querySelector(s);
function el(tag,parent,text,cls){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;parent.append(x);return x}
const statuses={committed:['커밋함','done'],progress:['진행 중','active'],planned:['예정','']};
const kinds={base:'원래 있던 것',new:'새로 만듦',edit:'기존 파일을 고침',work:'진행 중',plan:'예정',outside:'저장소 밖'};
document.title=q('h1').textContent=data.title;
for(const t of data.meta)el('span',q('.meta'),t);
for(const [v,l] of data.metrics){const box=el('div',q('.cards'),undefined,'metric');el('strong',box,v);el('span',box,l)}
for(const [k,t] of Object.entries(kinds)){const s=el('span',q('.legend'));el('i',s,undefined,'box '+k);el('span',s,t)}
const dlg=q('dialog');q('.close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg&&e.clientX<dlg.getBoundingClientRect().left)dlg.close()};

  if (/_page\.dart$|lib\/(main|navigation)\b|\/(settings|hooks)\.json$|^\.github\//.test(path)) return [0,'진입점'];
  if (/cubit|view_?model|controller|_bloc\.dart/i.test(path)) return [1,'상태와 동작'];
  if (/widget|screen|view\.dart/i.test(path)) return [2,'화면 표시'];
  if (/repository|service|api\/|bridge/i.test(path)) return [3,'처리와 연동'];
  if (/model|entity|source|storage/i.test(path)) return [4,'데이터'];
  if (/^(lib\/|tool\/|scripts\/)/.test(path)) return [5,'구현'];
  return [6,'설정과 리소스'];
}

function renderSide(container, hunk, after) {
  const pane=el('div',container,undefined,'side');
  const start=after?hunk.b:hunk.a;
  const lines=hunk.lines.filter(line=>line[0] !== (after?'-':'+'));
  const range=lines.length?'　L'+start+'–'+(start+lines.length-1):'';
  el('h5',pane,(after?'변경 후 · To-be':'변경 전 · As-is')+range);
  if (!lines.length) { el('p',pane,'이쪽에는 해당 줄이 없습니다.'); return; }
  const code=el('code',el('pre',pane));
  // Group adjacent lines with the same style so large vendor files stay readable without thousands of DOM nodes.
  for (let n=0;n<lines.length;) {
    const marker=lines[n][0], block=[];
    do {
      block.push(String(start+n).padStart(5)+'  '+marker+' '+lines[n].slice(1));
      n++;
    } while (n<lines.length && lines[n][0]===marker);
    el('span',code,block.join('\n'),'source-line'+(marker==='+'?' added':marker==='-'?' removed':''));
  }
}

async function renderCommit(box, item) {
  const compare=item.compare;
  if (!compare) return;
  const wrap=el('section',box,undefined,'commit-review');
  const heading=el('header',wrap);
  heading.textContent=compare.example?'템플릿 예시 · 가상 코드':'부모 '+compare.parent.slice(0,8)+' → 커밋 '+compare.commit.slice(0,8);
  if (!compare.files) {
    const progress=el('p',wrap,'변경 코드를 불러오는 중…');
    try {
      const response=await fetch(compare.src);
      if (!response.ok) throw Error(response.status);
      const result=await response.json();
      if (result.commit!==compare.commit || result.parent!==compare.parent) throw Error('commit mismatch');
      compare.files=result.files;
      if (!wrap.isConnected) return;
      progress.remove();
    } catch {
      progress.textContent='변경 코드를 불러오지 못했습니다. 패널을 다시 열어 주세요.';
      return;
    }
  }
  if (!compare.files.length) { el('p',wrap,'이 커밋에는 파일 변경이 없습니다.'); return; }
  const first=item.first||[];
  const rank=file=>{
    const explicit=first.findIndex(p=>p===file.path || (!p.includes('/') && file.path.split('/').pop()===p));
    return explicit<0?first.length+readingGroup(file.path)[0]:explicit;
  };
  const ordered=[...compare.files].sort((a,b)=>rank(a)-rank(b));
  for (const [index,file] of ordered.entries()) {
    const section=el('section',wrap,undefined,'review-file');
    el('small',section,(index+1)+' / '+ordered.length+'　'+readingGroup(file.path)[1],'file-meta');
    el('h3',section,file.path);
    if (file.notice) { el('p',section,file.notice); continue; }
    for (const [i,hunk] of file.hunks.entries()) {
      const part=el('div',section,undefined,'hunk');
      if(file.hunks.length>1) el('h4',part,'변경 구간 '+(i+1));
      const sides=el('div',part,undefined,'sides');
      renderSide(sides,hunk,false);renderSide(sides,hunk,true);
    }
  }
}

function show(item) {
  q('#detail-title').textContent=item.title;
  const box=q('.detail');
  box.replaceChildren();
  const reason=el('dl',box,undefined,'change-reason');
  for(const [key,value] of [['Why',item.why],['How',item.how]]) {
    el('dt',reason,key);el('dd',reason,value);
  }
  if(item.url){const link=el('a',box,'GitHub에서 변경 확인 ↗');link.href=item.url;}
  if(!dlg.open) dlg.showModal();
  dlg.scrollTop=0;
  renderCommit(box,item);
}

for(const [i,s] of data.steps.entries()){const [label,css]=statuses[s.status];const b=el('button',q('.steps'),(i+1)+' '+s.title,'pill '+css);b.onclick=()=>show(s);const row=el('tr',q('tbody'));for(const t of [i+1,s.title,s.goal,s.impact])el('td',row,t);el('span',el('td',row),label,'tag '+css);const link=el('button',el('td',row),s.link+' ›','open');link.setAttribute('aria-label',s.title+' 변경 상세');row.onclick=()=>show(s)}
for(const [i,l] of data.lanes.entries()){const lane=el('div',q('.chart'),undefined,'lane');const label=el('div',lane,l[0],'lane-label');if(l[1])el('small',label,l[1]);for(const [j,n] of data.nodes.entries()){if(n.lane!==i)continue;const b=el('button',lane,undefined,'node '+n.kind);b.id='n'+j;el('b',b,n.title);el('span',b,n.label);if(n.caption)el('small',b,n.caption);b.onclick=()=>show({...data.steps[n.step??0],...n})}}
const svg=q('svg'),ns='http://www.w3.org/2000/svg';function shape(tag,attrs,parent){const o=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>o.setAttribute(k,v));parent.append(o);return o}
function draw(){svg.replaceChildren();const base=svg.getBoundingClientRect();const defs=shape('defs',{},svg);for(const [i,[a,b,color,dash]] of data.edges.entries()){const r=q('#n'+a).getBoundingClientRect(),s=q('#n'+b).getBoundingClientRect();const side=Math.abs(r.top-s.top)<8;const x=(side?r.right:r.left+r.width/2)-base.left,y=(side?r.top+r.height/2:r.bottom)-base.top,u=(side?s.left:s.left+s.width/2)-base.left,v=(side?s.top+s.height/2:s.top)-base.top;const marker=shape('marker',{id:'arrow'+i,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto'},defs);shape('path',{d:'M0 0L8 4L0 8Z',fill:color},marker);const path=side?'M'+x+' '+y+' C'+(x+12)+' '+y+' '+(u-12)+' '+v+' '+u+' '+v:'M'+x+' '+y+' C'+x+' '+(y+18)+' '+u+' '+(v-18)+' '+u+' '+v;shape('path',{d:path,fill:'none',stroke:color,'stroke-width':1.7,'stroke-dasharray':dash?'4 3':'none','marker-end':'url(#arrow'+i+')'},svg)}}
new ResizeObserver(draw).observe(q('.chart'));document.fonts.ready.then(draw);
for(const t of data.method)el('li',q('.list'),t);
const key=el('li',q('.list'),'상태 표시　');for(const [t,k] of Object.values(statuses).reverse()){el('span',key,t,'tag '+k);key.append(' ')}
if(data.footer)el('p',q('.extra'),data.footer);if(data.url){const a=el('a',q('.extra'),'원본 PR 열기 ↗');a.href=data.url}
</script></body></html>
