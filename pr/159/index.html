<script>
const data=JSON.parse(document.querySelector('#report').textContent);
const q=s=>document.querySelector(s);
function el(tag,parent,text,cls){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;parent.append(x);return x}
const statuses={committed:['커밋함','done'],progress:['진행 중','active'],planned:['예정','']};
const kinds={base:'원래 있던 것',new:'새로 만듦',edit:'기존 파일을 고침',work:'진행 중',plan:'예정',outside:'저장소 밖'};
document.title=q('h1').textContent=data.title;
for(const t of data.meta)el('span',q('.meta'),t);
for(const [v,l] of data.metrics){const box=el('div',q('.cards'),undefined,'metric');el('strong',box,v);el('span',box,l)}
for(const [k,t] of Object.entries(kinds)){const s=el('span',q('.legend'));el('i',s,undefined,'box '+k);el('span',s,t)}
const dlg=q('dialog');q('.close').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg&&e.clientX<dlg.getBoundingClientRect().left)dlg.close()};

async function renderCommit(box, compare, selectedFile) {
  if (!compare) return;
  const wrap = el('section', box, undefined, 'commit-review');
  el('h3', wrap, '커밋별 변경 전후');
  const header = el('header', wrap);
  header.textContent = compare.example ? '템플릿 예시 · 가상 코드' :
    '부모 ' + compare.parent.slice(0, 8) + ' → 커밋 ' + compare.commit.slice(0, 8);

  if (!compare.files) {
    const progress=el('p',wrap,'변경 코드를 불러오는 중…');
    try {
      const response=await fetch(compare.src);
      if (!response.ok) throw Error(response.status);
      const result=await response.json();
      if(result.commit!==compare.commit || result.parent!==compare.parent) throw Error('commit');
      compare.files=result.files;
      progress.remove();
    } catch { progress.textContent='변경 코드를 불러오지 못했습니다. 패널을 다시 열어 주세요.';return; }
  }
  if (!compare.files.length) { el('p',wrap,'이 커밋에는 파일 변경이 없습니다.');return; }
  const label = el('label', wrap, '변경 파일 ' + compare.files.length + '개');
  const select = el('select', label, undefined, 'file-picker');
  for (const [i, file] of compare.files.entries()) {
    el('option', select, file.path).value = i;
  }
  if(selectedFile){const i=compare.files.findIndex(f=>f.path===selectedFile);if(i>=0) select.value=i;}
  const content = el('div', wrap);
  function side(container, hunk, isAfter) {
    const pane = el('div', container, undefined, 'side');
    const start = isAfter ? hunk.b : hunk.a;
    const relevant = hunk.lines.filter(line => line[0] !== (isAfter ? '-' : '+'));
    el('h5', pane, (isAfter ? '변경 후 · To-be' : '변경 전 · As-is') +
      (relevant.length ? '　L' + start + '–' + (start + relevant.length - 1) : ''));
    if (!relevant.length) { el('p', pane, '이쪽에는 해당 줄이 없습니다.'); return; }
    const code = el('code', el('pre', pane));
    relevant.forEach((line, offset) => {
      const marker = line[0];
      const color = marker === '+' ? ' added' : marker === '-' ? ' removed' : '';
      const row = el('span', code, undefined, 'source-line' + color);
      el('span', row, String(start + offset), 'line-no');
      el('span', row, marker, 'sign');
      row.append(document.createTextNode(line.slice(1)));
    });
  }
  function display() {
    content.replaceChildren();
    const file = compare.files[Number(select.value)];
    if(file.notice){el('p',content,file.notice);return;}
    const lines = file.hunks.flatMap(h => h.lines);
    const add = lines.filter(l => l[0] === '+').length;
    const del = lines.filter(l => l[0] === '-').length;
    el('p', content, file.hunks.length + '개 변경 구간 · 추가 ' + add + '줄 · 삭제 ' + del + '줄', 'file-meta');
    file.hunks.forEach((hunk, i) => {
      const part = el('div', content, undefined, 'hunk');
      el('h4', part, '변경 구간 ' + (i + 1));
      const sides = el('div', part, undefined, 'sides');
      side(sides, hunk, false);
      side(sides, hunk, true);
    });
  }
  select.onchange = display;
  display();
}

function show(item){q('#detail-title').textContent=item.title;const box=q('.detail');box.replaceChildren();el('p',box,item.note);for(const [label,txt] of [['변경 전 · as-is',item.before],['변경 후 · to-be',item.after]]){el('h3',box,label);el('pre',box,txt)}if(item.url){const a=el('a',box,'GitHub에서 변경 확인 ↗');a.href=item.url}
 renderCommit(box,item.compare,item.file);
 if(!dlg.open)dlg.showModal();dlg.scrollTop=0}
for(const [i,s] of data.steps.entries()){const [label,css]=statuses[s.status];const b=el('button',q('.steps'),(i+1)+' '+s.title,'pill '+css);b.onclick=()=>show(s);const row=el('tr',q('tbody'));for(const t of [i+1,s.title,s.goal,s.impact])el('td',row,t);el('span',el('td',row),label,'tag '+css);const link=el('button',el('td',row),s.link+' ›','open');link.setAttribute('aria-label',s.title+' 변경 상세');row.onclick=()=>show(s)}
for(const [i,l] of data.lanes.entries()){const lane=el('div',q('.chart'),undefined,'lane');const label=el('div',lane,l[0],'lane-label');if(l[1])el('small',label,l[1]);for(const [j,n] of data.nodes.entries()){if(n.lane!==i)continue;const b=el('button',lane,undefined,'node '+n.kind);b.id='n'+j;el('b',b,n.title);el('span',b,n.label);if(n.caption)el('small',b,n.caption);b.onclick=()=>show({...data.steps[n.step??0],...n})}}
const svg=q('svg'),ns='http://www.w3.org/2000/svg';function shape(tag,attrs,parent){const o=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>o.setAttribute(k,v));parent.append(o);return o}
function draw(){svg.replaceChildren();const base=svg.getBoundingClientRect();const defs=shape('defs',{},svg);for(const [i,[a,b,color,dash]] of data.edges.entries()){const r=q('#n'+a).getBoundingClientRect(),s=q('#n'+b).getBoundingClientRect();const side=Math.abs(r.top-s.top)<8;const x=(side?r.right:r.left+r.width/2)-base.left,y=(side?r.top+r.height/2:r.bottom)-base.top,u=(side?s.left:s.left+s.width/2)-base.left,v=(side?s.top+s.height/2:s.top)-base.top;const marker=shape('marker',{id:'arrow'+i,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto'},defs);shape('path',{d:'M0 0L8 4L0 8Z',fill:color},marker);const path=side?'M'+x+' '+y+' C'+(x+12)+' '+y+' '+(u-12)+' '+v+' '+u+' '+v:'M'+x+' '+y+' C'+x+' '+(y+18)+' '+u+' '+(v-18)+' '+u+' '+v;shape('path',{d:path,fill:'none',stroke:color,'stroke-width':1.7,'stroke-dasharray':dash?'4 3':'none','marker-end':'url(#arrow'+i+')'},svg)}}
new ResizeObserver(draw).observe(q('.chart'));document.fonts.ready.then(draw);
for(const t of data.method)el('li',q('.list'),t);
const key=el('li',q('.list'),'상태 표시　');for(const [t,k] of Object.values(statuses).reverse()){el('span',key,t,'tag '+k);key.append(' ')}
if(data.footer)el('p',q('.extra'),data.footer);if(data.url){const a=el('a',q('.extra'),'원본 PR 열기 ↗');a.href=data.url}
</script></body></html>
